name: Tests
on:
  push:
    branches:
      - '**'

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@ac6ac4d7829d8e8f85956c7474ee3ff99b98c9ed # 0.0.1
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      typo3-versions: '["13.4", "14.0", "14.3"]'
      dependencies: '["highest", "lowest"]'

  # Separate from the reusable TYPO3 workflow above, which only takes PHP and
  # TYPO3 inputs.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:js
