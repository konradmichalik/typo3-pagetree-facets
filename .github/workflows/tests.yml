name: Tests
on:
  push:
    branches:
      - '**'

jobs:
  tests:
    uses: konradmichalik/reusable-github-actions/.github/workflows/tests-typo3.yml@b207c7a6eb8db6c385156a57cdacaaa1c7d3cd0b # 0.2.0
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      typo3-versions: '["13.4", "14.0", "14.3"]'
      dependencies: '["highest", "lowest"]'

  # Separate from the reusable TYPO3 workflow above, which only takes PHP and
  # TYPO3 inputs.
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run test:js
