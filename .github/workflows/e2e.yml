name: E2E

on:
  push:
    branches:
      - main
    paths:
      - 'Classes/**'
      - 'Configuration/**'
      - 'Resources/**'
      - 'Tests/Playwright/**'
      - 'Tests/Functional/Fixtures/Extensions/**'
      - '.ddev/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ext_localconf.php'
      - 'ext_conf_template.txt'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'Classes/**'
      - 'Configuration/**'
      - 'Resources/**'
      - 'Tests/Playwright/**'
      - 'Tests/Functional/Fixtures/Extensions/**'
      - '.ddev/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ext_localconf.php'
      - 'ext_conf_template.txt'
      - '.github/workflows/e2e.yml'

# Cancels a superseded run on the same ref rather than letting it burn CI
# minutes for a result nobody will look at - relevant here specifically
# because a fresh push mid-run leaves the ddev instance mid-boot for the
# cancelled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Both supported majors, because they reach the page tree filter through
    # different core APIs: v14 through BeforePageTreeIsFilteredEvent, v13
    # through PageTreeFilterMiddleware. A green run on one says nothing about
    # the other.
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['13', '14']
    name: E2E (TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install ddev
        uses: ddev/github-action-setup-ddev@v1

      - name: Install TYPO3 ${{ matrix.typo3-version }}
        run: ddev install ${{ matrix.typo3-version }}

      - name: Install npm dependencies
        run: ddev exec npm ci

      - name: Install Playwright browsers
        run: ddev exec npx playwright install --with-deps chromium

      # Environment variables must be arguments to `ddev exec`, not a step-level
      # `env:` - the latter only sets them on the host runner and never reaches
      # the container, so CI-specific config (retries, html reporter) would never
      # activate.
      - name: Run Playwright tests
        run: ddev exec env CI=true TYPO3_VERSION=${{ matrix.typo3-version }} npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-typo3-${{ matrix.typo3-version }}
          path: playwright-report/
          retention-days: 14
