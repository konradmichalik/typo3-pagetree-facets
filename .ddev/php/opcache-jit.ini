[PHP]
; pcov (always loaded for `composer test:coverage`) overrides zend_execute_ex(),
; which trips OPcache's JIT compatibility check on every PHP CLI call regardless
; of opcache.jit's own value - the check fires whenever jit_buffer_size is
; non-zero. Zeroing the buffer silences the "JIT ... disabled" warning without
; affecting coverage or anything else, since JIT is already off by default here.
opcache.jit_buffer_size = 0
